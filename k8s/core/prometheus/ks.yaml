---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-prometheus-stack-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/core/prometheus/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-volsync-app
  postBuild:
    substitute:
      APP: grafana
      VOLSYNC_CLAIM: grafana-data
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "55 4 * * *"
      VOLSYNC_UID: "472"
      VOLSYNC_GID: "472"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
