---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-secrets
spec:
  namespaceSelector:
    matchNames: [external-secrets]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [external-secrets, external-secrets-webhook, external-secrets-cert-controller]
  podMetricsEndpoints:
    - port: metrics

