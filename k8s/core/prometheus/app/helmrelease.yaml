apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: prometheus
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.10.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  interval: 1h
  values:
    grafana:
      deploymentStrategy:
        type: Recreate
      defaultDashboardsTimezone: browser
      grafana.ini:
        server:
          root_url: https://grafana.${CLUSTER_DOMAIN}
        auth:
          signout_redirect_url: https://sso.${CLUSTER_DOMAIN}/application/o/grafana/end-session/
          oauth_auto_login: true
        auth.generic_oauth:
          name: Authentik
          enabled: true
          scopes: openid email profile offline_access
          auth_url: https://sso.${CLUSTER_DOMAIN}/application/o/authorize/
          token_url: https://sso.${CLUSTER_DOMAIN}/application/o/token/
          api_url: https://sso.${CLUSTER_DOMAIN}/application/o/userinfo/
          client_id: $__file{/etc/secrets/grafana_oauth/client_id}
          client_secret: $__file{/etc/secrets/grafana_oauth/client_secret}
          token_rotation_interval_minutes: "5"
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'power') && 'Editor' || 'Viewer'
      extraSecretMounts:
        - name: grafana-oauth-secret-mount
          secretName: grafana-oauth-secret
          defaultMode: 0440
          mountPath: /etc/secrets/grafana_oauth
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: grafana.${CLUSTER_DOMAIN}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - grafana.${CLUSTER_DOMAIN}
        tls:
          - hosts:
              - grafana.${CLUSTER_DOMAIN}
            secretName: grafana-tls
        https: false
      persistence:
        type: pvc
        enabled: true
        existingClaim: grafana-data
      resources:
        requests: { cpu: 50m, memory: 512Mi }
        limits: { memory: 1Gi }

    alertmanager:
      # Merged into the chart's default config: inhibit_rules, timings and
      # templates come from the chart, route/receivers are replaced.
      # No "$" in config/templates: Flux postBuild substitution runs on this file.
      config:
        global:
          # Only applies to alerts without endsAt, i.e. Flux events
          # (Prometheus always sets endsAt): a failing object that keeps
          # erroring stays one alert instead of flapping every 5m.
          resolve_timeout: 1h
        route:
          receiver: telegram
          group_by: [namespace, alertname]
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
            - receiver: "null"
              matchers:
                - severity = "info"
            # Flux events (Provider type alertmanager): they only expire,
            # they never really resolve, so no "resolved" message.
            - receiver: telegram-flux
              matchers:
                - reportingcontroller =~ ".+"
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
                parse_mode: HTML
                send_resolved: true
                message: '{{ template "telegram.polaris.message" . }}'
          - name: telegram-flux
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
                parse_mode: HTML
                send_resolved: false
                message: '{{ template "telegram.polaris.message" . }}'
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.polaris.message" }}
          {{- if eq .Status "firing" }}🔥{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b>
          {{- with .CommonLabels.severity }} · {{ . }}{{ end }}
          {{- if eq .Status "resolved" }} · resolved{{ end }}
          {{- range .Alerts }}

          {{ if eq .Status "firing" }}•{{ else }}✓{{ end }}
          {{- if .Annotations.description }} {{ .Annotations.description | html }}
          {{- else if .Annotations.message }} <code>{{ .Labels.kind }} {{ .Labels.namespace }}/{{ .Labels.name }}</code>: {{ .Annotations.message | html }}
          {{- else }} {{ .Annotations.summary | html }}
          {{- end }}
          {{- with .Annotations.runbook_url }} <a href="{{ . }}">runbook</a>{{ end }}
          {{- end }}
          {{- end }}
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: alertmanager.${CLUSTER_DOMAIN}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - alertmanager.${CLUSTER_DOMAIN}
        tls:
          - hosts:
              - alertmanager.${CLUSTER_DOMAIN}
            secretName: alertmanager-tls
        https: false
      alertmanagerSpec:
        secrets: [alertmanager-telegram]
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi
    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: prometheus.${CLUSTER_DOMAIN}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - prometheus.${CLUSTER_DOMAIN}
        tls:
          - hosts:
              - prometheus.${CLUSTER_DOMAIN}
            secretName: prometheus-tls
        https: false
      prometheusSpec:
        scrapeInterval: 30s
        evaluationInterval: 30s
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            memory: 1536Mi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 25Gi
    prometheusOperator:
      networkPolicy:
        enabled: true
        flavor: cilium
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 128Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits: { memory: 192Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 96Mi }

    kubeProxy:
      enabled: false

    kubeEtcd:
      endpoints:
        - 10.10.5.11
        - 10.10.5.12
        - 10.10.5.13
      service:
        port: 2381
        targetPort: 2381
