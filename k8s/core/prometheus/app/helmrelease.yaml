apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: prometheus
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.13.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  interval: 1h
  values:
    grafana:
      deploymentStrategy:
        type: Recreate
      defaultDashboardsTimezone: browser
      grafana.ini:
        server:
          root_url: https://grafana.${CLUSTER_DOMAIN}
        auth:
          signout_redirect_url: https://sso.${CLUSTER_DOMAIN}/application/o/grafana/end-session/
          oauth_auto_login: true
        auth.generic_oauth:
          name: Authentik
          enabled: true
          scopes: openid email profile offline_access
          auth_url: https://sso.${CLUSTER_DOMAIN}/application/o/authorize/
          token_url: https://sso.${CLUSTER_DOMAIN}/application/o/token/
          api_url: https://sso.${CLUSTER_DOMAIN}/application/o/userinfo/
          client_id: $__file{/etc/secrets/grafana_oauth/client_id}
          client_secret: $__file{/etc/secrets/grafana_oauth/client_secret}
          token_rotation_interval_minutes: "5"
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'power') && 'Editor' || 'Viewer'
      extraSecretMounts:
        - name: grafana-oauth-secret-mount
          secretName: grafana-oauth-secret
          defaultMode: 0440
          mountPath: /etc/secrets/grafana_oauth
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: grafana.${CLUSTER_DOMAIN}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - grafana.${CLUSTER_DOMAIN}
        tls:
          - hosts:
              - grafana.${CLUSTER_DOMAIN}
            secretName: grafana-tls
        https: false
      persistence:
        type: pvc
        enabled: true
        existingClaim: grafana-data
      resources:
        requests: { cpu: 50m, memory: 512Mi }
        limits: { memory: 1Gi }

    alertmanager:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: alertmanager.${CLUSTER_DOMAIN}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - alertmanager.${CLUSTER_DOMAIN}
        tls:
          - hosts:
              - alertmanager.${CLUSTER_DOMAIN}
            secretName: alertmanager-tls
        https: false
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi
    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: prometheus.${CLUSTER_DOMAIN}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - prometheus.${CLUSTER_DOMAIN}
        tls:
          - hosts:
              - prometheus.${CLUSTER_DOMAIN}
            secretName: prometheus-tls
        https: false
      prometheusSpec:
        scrapeInterval: 30s
        evaluationInterval: 30s
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            memory: 1536Mi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 25Gi
    prometheusOperator:
      networkPolicy:
        enabled: true
        flavor: cilium
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 128Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits: { memory: 192Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 96Mi }

    kubeProxy:
      enabled: false

    kubeEtcd:
      endpoints:
        - 10.10.5.11
        - 10.10.5.12
        - 10.10.5.13
      service:
        port: 2381
        targetPort: 2381
