apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: grafana-oauth-secret
    namespace: prometheus
spec:
  refreshInterval: 1h0m
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-oauth-secret
  data:
    - secretKey: client_id
      remoteRef:
        key: "4940091f-5a4f-49a4-8530-b45a00dfe4c5"
    - secretKey: client_secret
      remoteRef:
        key: "968fc0da-a919-4067-b70b-b45a00dff808"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: prometheus
spec:
  refreshInterval: 1h0m
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
  data:
    - secretKey: bot_token
      remoteRef:
        key: "ebf95ec7-fe22-4b18-a4f2-b50d00bf9ce6"
    - secretKey: chat_id
      remoteRef:
        key: "64b3088a-af51-425d-ad86-b50d00c10fe9"
