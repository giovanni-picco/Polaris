apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "42.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 1h
  
  install:
    crds: Create

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  
  values:
    service:
      type: LoadBalancer

    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${CLUSTER_DOMAIN}`)
        entryPoints:
          - websecure
        tls:
          secretName: dashboard-traefik-tls

    providers:
      kubernetesCRD:
        safeNaming: true
      kubernetesIngress:
        publishedService:
          enabled: true

    api:
      dashboard: true
      insecure: false

    ports:
      web:
        http:
          aliasHeadersStrategy: delete
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          aliasHeadersStrategy: delete
      traefik:
        http:
          aliasHeadersStrategy: delete
      metrics:
        http:
          aliasHeadersStrategy: delete
      git-ssh:
        port: 2222
        nodePort: 22
        http:
          aliasHeadersStrategy: delete

    metrics:
      prometheus:
        enabled: true

    extraObjects:
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: dashboard-traefik-certificate
          namespace: traefik
        spec:
          secretName: dashboard-traefik-tls
          issuerRef:
            name: letsencrypt
            kind: ClusterIssuer
          commonName: traefik.${CLUSTER_DOMAIN}
          dnsNames:
            - traefik.${CLUSTER_DOMAIN}

    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 256Mi }
