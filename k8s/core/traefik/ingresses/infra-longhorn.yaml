# infra: Longhorn UI. Longhorn has no login of its own, so it sits behind the
# authentik embedded outpost (proxy provider "longhorn" in forward auth mode).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: longhorn-system
spec:
  forwardAuth:
    address: http://ak-outpost-traefik.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: &domain longhorn.${CLUSTER_DOMAIN}
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - *domain
      secretName: longhorn-tls
  rules:
    - host: *domain
      http:
        paths:
          - backend:
              service:
                name: longhorn-frontend
                port:
                  name: http
            path: /
            pathType: Prefix
