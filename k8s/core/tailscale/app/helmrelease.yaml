apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 5m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.1"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale

  install:
    crds: Create

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true

  values:
    apiServerProxyConfig: 
      mode: "true"
    operatorConfig:
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits: { memory: 192Mi }
