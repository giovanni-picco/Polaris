apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-tailscale-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/core/tailscale/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core-external-secrets-bitwarden
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-tailscale-connector
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/core/tailscale/connector
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core-tailscale-app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
