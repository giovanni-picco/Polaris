apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 5m
  chart:
    spec:
      chart: external-secrets
      version: "2.13.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system

  install:
    crds: Create

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true

  values:
    bitwarden-sdk-server:
      enabled: true
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits: { memory: 192Mi }
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 96Mi }
    certController:
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits: { memory: 192Mi }
