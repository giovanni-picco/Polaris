apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
spec:
  instances: 1
  # Single instance: a PDB only blocks node drains (Talos upgrades), it
  # cannot keep the database available anyway
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  storage:
    size: 20Gi
    storageClass: longhorn-database
  resources:
    requests:
      cpu: 500m 
      memory: 1Gi
    limits:
      cpu: 750m
      memory: 2Gi