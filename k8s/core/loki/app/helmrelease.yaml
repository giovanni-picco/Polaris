apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  chart:
    spec:
      chart: loki
      version: 7.3.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-loki
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  interval: 1h
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        retention_period: 720h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn-default
        size: 50Gi

    backend:   { replicas: 0 }
    read:      { replicas: 0 }
    write:     { replicas: 0 }
    ingester:  { replicas: 0 }
    querier:   { replicas: 0 }
    queryFrontend: { replicas: 0 }
    queryScheduler: { replicas: 0 }
    distributor: { replicas: 0 }
    compactor: { replicas: 0 }
    indexGateway: { replicas: 0 }
    bloomCompactor: { replicas: 0 }
    bloomGateway: { replicas: 0 }

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    gateway:
      enabled: false

    test:
      enabled: false
    lokiCanary:
      enabled: false