apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER}-s3
spec:
  refreshInterval: 1h0m
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: ${CNPG_CLUSTER}-s3
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKey }}"
        ACCESS_SECRET_KEY: "{{ .secretKey }}"
        REGION: nbg1
  data:
    - secretKey: accessKey
      remoteRef:
        key: "c2fd7c33-3c03-45f0-921c-b4e60144d8e7"
    - secretKey: secretKey
      remoteRef:
        key: "a381615b-984f-488a-9b1f-b4e60144ef4a"
