apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync
spec:
  refreshInterval: 1h0m
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: ${APP}-volsync
    template:
      data:
        RESTIC_REPOSITORY: s3:https://nbg1.your-objectstorage.com/polaris-volsync/${APP}
        RESTIC_PASSWORD: "{{ .resticPassword }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: "c2fd7c33-3c03-45f0-921c-b4e60144d8e7"
    - secretKey: secretKey
      remoteRef:
        key: "a381615b-984f-488a-9b1f-b4e60144ef4a"
    - secretKey: resticPassword
      remoteRef:
        key: "2cbf32b2-c5ef-4d10-abd5-b4e60145868f"
