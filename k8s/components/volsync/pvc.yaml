apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${VOLSYNC_CLAIM}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${VOLSYNC_STORAGECLASS:=longhorn-default}
  resources:
    requests:
      storage: ${VOLSYNC_CAPACITY}
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: ${APP}-dst
