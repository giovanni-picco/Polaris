apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 10m
  chart:
    spec:
      chart: volsync
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: volsync-system

  install:
    crds: Create

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true

  values:
    manageCRDs: true
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
