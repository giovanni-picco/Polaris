apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: snapshot-controller
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: kube-system

  install:
    crds: Create

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true

  values:
    controller:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

