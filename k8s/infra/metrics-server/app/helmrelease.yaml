apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: kube-system

  values:
    args:
      # Talos kubelets serve a self-signed certificate
      - --kubelet-insecure-tls
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
