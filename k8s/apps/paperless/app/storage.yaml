apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: paperless
spec:
  storageClassName: longhorn-default
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-export
  namespace: paperless
spec:
  storageClassName: longhorn-default
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
