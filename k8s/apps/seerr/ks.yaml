apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-seerr-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/apps/seerr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-volsync-app
  postBuild:
    substitute:
      APP: seerr
      VOLSYNC_CLAIM: seerr-config
      VOLSYNC_CAPACITY: 5Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
