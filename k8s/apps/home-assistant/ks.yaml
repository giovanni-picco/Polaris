apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-home-assistant-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/apps/home-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-volsync-app
  postBuild:
    substitute:
      APP: home-assistant
      VOLSYNC_CLAIM: home-assistant-config
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "45 4 * * *"
      VOLSYNC_UID: "0"
      VOLSYNC_GID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
