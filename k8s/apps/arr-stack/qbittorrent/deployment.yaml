apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: arr-stack
  labels:
    app: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role/worker
                    operator: In
                    values: ["true"]

      containers:
        # hotio's image runs the WireGuard tunnel to PIA (config generated from
        # the PIA credentials, port forwarding included) in the same container
        # as qBittorrent, with an nftables kill switch: no VPN sidecar.
        # Kubernetes/Cilium-specific fixes live in the wireguard/ hooks.
        - name: qbittorrent
          image: ghcr.io/hotio/qbittorrent:release-5.3.1

          securityContext:
            capabilities:
              add: ["NET_ADMIN"]

          env:
            - name: TZ
              value: Europe/Rome
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: WEBUI_PORTS
              value: "8080/tcp"
            - name: VPN_ENABLED
              value: "true"
            - name: VPN_CONF
              value: "wg0"
            - name: VPN_PROVIDER
              value: "pia"
            - name: VPN_PIA_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secrets
                  key: pia-main-user
            - name: VPN_PIA_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secrets
                  key: pia-main-password
            - name: VPN_PIA_PREFERRED_REGION
              value: "nl_amsterdam"
            # PIA port forwarding: qBittorrent is started on the forwarded port
            # and restarted if it changes.
            - name: VPN_AUTO_PORT_FORWARD
              value: "true"
            # Use the DNS servers PIA hands out, through the tunnel.
            - name: VPN_NAMESERVERS
              value: "wg"
            # Exit the container (kubelet restarts it) if internet through the
            # tunnel stays down for ~10 minutes.
            - name: VPN_HEALTHCHECK_ENABLED
              value: "true"
            # Read by the wireguard/ hooks.
            - name: WG_MTU
              value: "1380"
            - name: POD_ROUTE_MTU
              value: "1450"
            - name: LAN_NETWORKS
              value: "10.244.0.0/16,10.10.0.0/16"

          ports:
            - name: http
              protocol: TCP
              containerPort: &port 8080

          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            # The linuxserver image kept config and data together in
            # /config/qBittorrent; hotio splits them into /config/config and
            # /config/data. Map both onto the existing directory: no migration,
            # and switching back to linuxserver keeps working.
            - name: qbittorrent-config
              mountPath: /config/config
              subPath: qBittorrent
            - name: qbittorrent-config
              mountPath: /config/data
              subPath: qBittorrent
            - name: wireguard-hooks
              mountPath: /config/wireguard/wg0-pre.sh
              subPath: wg0-pre.sh
            - name: wireguard-hooks
              mountPath: /config/wireguard/wg0-post.sh
              subPath: wg0-post.sh
            - name: media-torrents
              mountPath: /data/torrents

          # qBittorrent starts only once the tunnel is up and PIA has handed
          # out a forwarded port.
          startupProbe:
            httpGet:
              path: /
              port: *port
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /
              port: *port
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: *port
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi

      volumes:
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: wireguard-hooks
          configMap:
            name: qbittorrent-wireguard-hooks
        - name: media-torrents
          persistentVolumeClaim:
            claimName: media-torrents
