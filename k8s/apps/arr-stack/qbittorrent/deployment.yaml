apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: arr-stack
  labels:
    app: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role/worker
                    operator: In
                    values: ["true"]

      initContainers:
        # Refresh the VPN server list before connecting: the list built into the
        # image ages, and PIA renumbers its servers (stale IPs = TLS handshake
        # timeout forever). Non-fatal: falls back to the built-in list.
        - image: ghcr.io/qdm12/gluetun:v3.41.3
          name: gluetun-servers-update
          command:
            - sh
            - -c
            - /gluetun-entrypoint update -enduser -providers 'private internet access' || echo 'server list update failed, using the built-in one'
          volumeMounts:
            - name: gluetun-data
              mountPath: /gluetun
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi

        - image: ghcr.io/qdm12/gluetun:v3.41.3
          name: gluetun

          imagePullPolicy: Always

          securityContext:
            capabilities:
              add: ["NET_ADMIN"]

          ports:
            - name: http
              protocol: TCP
              containerPort: &port 8080

          env:
            - name: TZ
              value: 'Europe/Rome'
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: "openvpn"
            - name: SERVER_REGIONS
              value: "Netherlands"
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secrets
                  key: pia-main-user
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secrets
                  key: pia-main-password
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.244.0.0/16,10.10.0.0/16,192.168.0.0/16"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: UPDATER_PERIOD
              value: "24h"
            # Keep encapsulated packets under the pod MTU (1450, Cilium VXLAN)
            # and the WAN path MTU (1492, PPPoE). With the default tun-mtu 1500
            # OpenVPN's UDP packets (~1550 bytes) get fragmented, and fragments
            # leaving the pod are dropped: the tunnel connects but then stalls.
            # 1380 + ~52 bytes of OpenVPN/UDP/IP overhead = ~1432.
            - name: OPENVPN_FLAGS
              value: "--tun-mtu 1380"
            - name: OPENVPN_MSSFIX
              value: "1300"

          volumeMounts:
            - name: gluetun-data
              mountPath: /gluetun

          restartPolicy: Always

          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # No livenessProbe: gluetun already restarts the VPN by itself when
          # its healthcheck fails (HEALTH_RESTART_VPN). Having kubelet kill the
          # container too only adds CrashLoopBackOff delays (up to 5 min) during
          # which qbittorrent has no network at all.

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi

      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.1
          env:
            - name: TZ
              value: Europe/Rome
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: WEBUI_PORT
              value: "8080"

          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: media-torrents
              mountPath: /data/torrents

          livenessProbe:
            httpGet:
              path: /
              port: *port
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: *port
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi

      volumes:
        - name: gluetun-data
          emptyDir: {}
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media-torrents
          persistentVolumeClaim:
            claimName: media-torrents
