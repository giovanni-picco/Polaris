apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autobrr
  namespace: arr-stack
  annotations:
    external-dns.alpha.kubernetes.io/hostname: &domain autobrr.${CLUSTER_DOMAIN}
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - *domain
      secretName: autobrr-tls
  rules:
    - host: *domain
      http:
        paths:
          - backend:
              service:
                name: autobrr
                port:
                  number: 7474
            path: /
            pathType: Prefix
