apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
  namespace: arr-stack
  labels:
    app: lazylibrarian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lazylibrarian
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lazylibrarian
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role/worker
                    operator: In
                    values: ["true"]

      containers:
        - name: lazylibrarian
          image: ghcr.io/linuxserver/lazylibrarian:version-600a11cc
          env:
            - name: TZ
              value: "Europe/Rome"
            - name: DOCKER_MODS
              value: "linuxserver/mods:lazylibrarian-ffmpeg"

          ports:
            - containerPort: 5299
              name: http

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: lazylibrarian-config
              mountPath: /config
            - name: media-torrents
              mountPath: /downloads
            - name: media-media
              mountPath: /data

          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "1Gi"

      volumes:
        - name: lazylibrarian-config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
        - name: media-torrents
          persistentVolumeClaim:
            claimName: media-torrents
        - name: media-media
          persistentVolumeClaim:
            claimName: media-media