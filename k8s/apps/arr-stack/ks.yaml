apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-arr-stack-media
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/apps/arr-stack/media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-arr-stack-qbittorrent
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/apps/arr-stack/qbittorrent
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-volsync-app
    - name: apps-arr-stack-media
  postBuild:
    substitute:
      APP: qbittorrent
      VOLSYNC_CLAIM: qbittorrent-config
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "15 4 * * *"
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
