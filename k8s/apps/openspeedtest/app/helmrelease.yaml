apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openspeedtest
  namespace: openspeedtest
spec:
  interval: 5m
  chart:
    spec:
      chart: openspeedtest
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: openspeedtest
        namespace: openspeedtest

  install:
    remediation:
      retries: 5

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    replicaCount: 1

    podAnnotations: {}

    podSecurityContext:
      fsGroup: 2000

    securityContext:
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    service:
      type: LoadBalancer
      port: 3000

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: &host speedtest.${CLUSTER_DOMAIN}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      tls:
        - hosts:
            - *host
          secretName: openspeedtest-tls
      https: false
      hosts:
        - host: *host
          paths:
            - path: /
              pathType: ImplementationSpecific

    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role/worker
                    operator: In
                    values: ["true"]