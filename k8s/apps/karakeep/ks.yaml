apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-karakeep-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/apps/karakeep/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-volsync-app
  postBuild:
    substitute:
      APP: karakeep
      VOLSYNC_CLAIM: karakeep-data
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: longhorn-critical
      VOLSYNC_SCHEDULE: "50 4 * * *"
      VOLSYNC_UID: "0"
      VOLSYNC_GID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
