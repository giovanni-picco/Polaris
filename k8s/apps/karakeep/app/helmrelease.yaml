apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 5m
  chart:
    spec:
      chart: karakeep
      version: "0.33.1"
      sourceRef:
        kind: HelmRepository
        name: karakeep-app
        namespace: karakeep

  install:
    remediation:
      retries: 5

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    applicationProtocol: https
    applicationHost: &host karakeep.${CLUSTER_DOMAIN}

    secrets:
      karakeep:
        enabled: false
      meilesearch:
        enabled: false

    controllers:
      karakeep:
        containers:
          karakeep:
            env:
              TZ: Europe/Rome
              DISABLE_NEW_RELEASE_CHECK: "true"

              OAUTH_WELLKNOWN_URL: https://sso.${CLUSTER_DOMAIN}/application/o/karakeep/.well-known/openid-configuration
              OAUTH_PROVIDER_NAME: Authentik
              OAUTH_SCOPE: openid email profile
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
              DISABLE_PASSWORD_AUTH: "true"

              # Il modello di default (gpt-5.x) rifiuta max_tokens
              INFERENCE_USE_MAX_COMPLETION_TOKENS: "true"

            envFrom:
              - secretRef:
                  name: karakeep-secret
              - secretRef:
                  name: sso-client
              - secretRef:
                  name: openai-cred

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

        pod:
          affinity: &affinity
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role/worker
                        operator: In
                        values: ["true"]

        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: longhorn-critical
              globalMounts:
                - path: /data

      chrome:
        containers:
          chrome:
            # gcr.io/zenika-hub non è più accessibile (403), stessa immagine da Docker Hub
            image:
              repository: docker.io/zenika/alpine-chrome
              tag: "124"
            # Il namespace applica PodSecurity "baseline": niente SYS_ADMIN, quindi sandbox disabilitata
            args:
              - --no-sandbox
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --headless
              - --hide-scrollbars
              - --disable-gpu
              - --disable-dev-shm-usage
            securityContext:
              capabilities:
                add: []
                drop:
                  - ALL
        pod:
          affinity: *affinity

    ingress:
      karakeep:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: *host
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: karakeep
                  port: http
        tls:
          - hosts:
              - *host
            secretName: karakeep-tls

    meilisearch:
      auth:
        existingMasterKeySecret: karakeep-secret
      environment:
        MEILI_ENV: production
        MEILI_NO_ANALYTICS: true
        # Di default Meilisearch si dimensiona su RAM/core del nodo, non sui limiti del container (OOMKilled)
        MEILI_MAX_INDEXING_MEMORY: 512Mb
        MEILI_MAX_INDEXING_THREADS: 2
      persistence:
        enabled: true
        size: 2Gi
        storageClass: longhorn-default
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 2Gi
      affinity: *affinity
