apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-jellyfin-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/apps/jellyfin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-volsync-app
  postBuild:
    substitute:
      APP: jellyfin
      VOLSYNC_CLAIM: jellyfin-config
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "30 4 * * *"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config