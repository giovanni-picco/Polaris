---
clusterName: POLARIS
talosVersion: v1.14.4
kubernetesVersion: v1.36.5

endpoint: https://kube.polarislab.dev:6443

additionalApiServerCertSans:
  - kube.polarislab.dev
  - 10.10.5.10

additionalMachineCertSans:
  - kube.polarislab.dev
  - 10.10.5.10
  - 10.10.5.11
  - 10.10.5.12
  - 10.10.5.13
  - 10.10.5.14
  - 10.10.5.15

cniConfig:
  name: none

nodes:
  - hostname: PCP-01
    ipAddress: 10.10.5.11
    controlPlane: true
    installDisk: /dev/sdb
    networkInterfaces:
      - interface: enp1s0
        dhcp: true
        vip:
          ip: 10.10.5.10

  - hostname: PCP-02
    ipAddress: 10.10.5.12
    controlPlane: true
    installDisk: /dev/sdb
    networkInterfaces:
      - interface: enp1s0
        dhcp: true
        vip:
          ip: 10.10.5.10

  - hostname: PCP-03
    ipAddress: 10.10.5.13
    controlPlane: true
    installDisk: /dev/sdb
    networkInterfaces:
      - interface: enp1s0
        dhcp: true
        vip:
          ip: 10.10.5.10

  - hostname: PWR-01
    ipAddress: 10.10.5.14
    controlPlane: false
    installDisk: /dev/nvme0n1
    networkInterfaces:
      - interface: bond0
        dhcp: true
        bond:
          mode: 802.3ad
          miimon: 100
          updelay: 200
          downdelay: 200
          lacpRate: fast
          interfaces:
            - enp87s0
            - enp89s0

  - hostname: PWR-02
    ipAddress: 10.10.5.15
    controlPlane: false
    installDisk: /dev/nvme0n1
    networkInterfaces:
      - interface: bond0
        dhcp: true
        bond:
          mode: 802.3ad
          miimon: 100
          updelay: 200
          downdelay: 200
          lacpRate: fast
          interfaces:
            - enp87s0
            - enp89s0

controlPlane:
  machineSpec:
    secureboot: true
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/iscsi-tools
      
  patches:
    - |-
      cluster:
        allowSchedulingOnControlPlanes: true
        proxy:
          disabled: true
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381

worker:
  machineSpec:
    secureboot: true
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/iscsi-tools
  patches:
    - |-
      machine:
        nodeLabels:
          node-role/worker: "true"
